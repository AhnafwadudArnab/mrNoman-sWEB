<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="ElectroZoneBD - Buy electronics online in Bangladesh. Best deals on home appliances, gadgets & more.">
  <meta name="keywords" content="electronics, bangladesh, online shop, home appliances, gadgets, electrozonebd">
  <meta name="author" content="ElectroZoneBD">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ElectroZoneBD - Online Electronics Shop">
  <meta property="og:description" content="Best deals on electronics & home appliances in Bangladesh.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ElectroZoneBD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect to Google CDN and backend API for ultra-fast startup -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://electrozonebd.com">
  <link rel="dns-prefetch" href="https://electrozonebd.com">

  <!-- Parallel preloading: download JS and CanvasKit WASM simultaneously at second 0 -->
  <link rel="preload" href="flutter_bootstrap.js?v=20260707_1125" as="script">
  <link rel="preload" href="main.dart.js?v=20260707_1125" as="script">
  <link rel="preload" href="https://www.gstatic.com/flutter-canvaskit/425cfb54d01a9472b3e81d9e76fd63a4a44cfbcb/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">

  <title>ElectroZoneBD</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #E5E7EB;
      border-top-color: #F59E0B;
      border-right-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #64748B;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand-title">ElectroZone<span style="color:#F59E0B">BD</span></div>
    <div class="brand-subtitle">Loading your electronics store...</div>
  </div>
  <script src="flutter_bootstrap.js?v=20260707_1125" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
